<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contest administration</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173047;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:620px;margin:6vh auto;background:white;border:1px solid #dde7f0;border-radius:18px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 40px #1730470e}h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px}p{line-height:1.5;color:#536778}.brand{font-weight:700;color:#1767ba;font-size:13px;letter-spacing:.09em;margin-bottom:24px}label{display:block;font-weight:650;margin:24px 0 8px}input{width:100%;border:1px solid #b5c5d4;padding:14px 15px;border-radius:10px;font-size:16px}input:focus{outline:2px solid #1767ba;outline-offset:2px}.actions{display:grid;gap:12px;margin:22px 0}button{border:0;border-radius:10px;padding:14px 16px;background:#1666b5;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{color:#1666b5;background:#e8f1fa}button:disabled{opacity:.6;cursor:wait}.message{min-height:22px;font-size:14px}.message.error{color:#ae2639}.message.ok{color:#19744d}.foot{font-size:13px;border-top:1px solid #e4eaf0;margin-top:25px;padding-top:15px}a{color:#1666b5}
</style></head><body><main class="wrap"><div class="brand">PTU CONTEST · ORGANISERS</div><h1>Contest administration</h1><p>Download contestant entries and project attachments. This page is for authorised organisers only.</p><label for="key">Administrator key</label><input id="key" type="password" placeholder="Enter CONTEST_ADMIN_KEY" autocomplete="off" spellcheck="false"><div class="actions"><button id="csv" type="button">Download entries (CSV)</button><button id="zip" type="button" class="secondary">Download entries and files (ZIP)</button></div><p id="message" class="message" role="status" aria-live="polite"></p><p class="foot">Your key is sent to the protected Netlify Functions endpoint only when downloading. It is not saved in your browser. <a href="/">Return to contest website</a>.</p></main>
<script>
const keyField=document.getElementById('key');const csvBtn=document.getElementById('csv');const zipBtn=document.getElementById('zip');const message=document.getElementById('message');
async function download(kind){const key=keyField.value;if(!key.trim()){message.className='message error';message.textContent='Enter your administrator key first.';keyField.focus();return}csvBtn.disabled=zipBtn.disabled=true;message.className='message';message.textContent='Preparing your download…';try{const endpoint=kind==='csv'?'/.netlify/functions/export':'/.netlify/functions/download-all';const response=await fetch(endpoint,{headers:{'x-contest-key':key},cache:'no-store'});if(!response.ok){let detail=await response.text();if(response.status===403)detail='Access denied. Check CONTEST_ADMIN_KEY in Netlify environment variables and redeploy.';throw new Error(detail.slice(0,240)||`HTTP ${response.status}`)}const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=kind==='csv'?'contest_entries.csv':'contest_all_files.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message.className='message ok';message.textContent='Download started.'}catch(e){message.className='message error';message.textContent=String(e.message||e)}finally{csvBtn.disabled=zipBtn.disabled=false}}
csvBtn.addEventListener('click',()=>download('csv'));zipBtn.addEventListener('click',()=>download('zip'));
</script></body></html>
